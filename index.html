<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoStock | inicio</title>
</head>
<body>
        <header id="headerPrincipal">
        <h1>TecnoStock</h1>
        <input type="text" id="inputBusqueda" aria-label="Buscar productos" placeholder=" ⌕ Buscar productos...">
        <button id="btnCarrito" class="btn-carrito" aria-label="abrir carrito" aria-expanded="false" aria-controls="panelCarrito">💼︎
            <span class="cart-count">0</span>
        </button>
    </header>
    <main>
        <h2>Categorías</h2>
        <nav class="categorias">
            <button type="button" data-category="todos" class="activo">⌗ Todos</button>
            <button type="button" data-category="perifericos"> Perifericos</button>
            <button type="button" data-category="componentes">Componentes</button>
            <button type="button" data-category="mantenimiento">💻︎ Mantenimiento</button>
        </nav>

        <section class="seccion-productos">
            <div class="orden-productos">
                <label for="selectOrden">Ordenar por:</label>
                <select id="selectOrden">
                    <option value="default">Relevancia</option>
                    <option value="precio-asc">Precio: menor a mayor</option>
                    <option value="precio-desc">Precio: mayor a menor</option>
                    <option value="nombre-az">Nombre: A-Z</option>
                    <option value="nombre-za">Nombre: Z-A</option>
                </select>
            </div>
            <section class="seccion-productos">
            <h2>Favoritos de la semana</h2>
            <p>Los más elegidos por la comunidad</p>
            <div class="grid-productos"></div>
            </section>
        </section>
    </main>
    <footer>
        <p>© 2024 fakeStore. Todos los derechos reservados.</p>
        <div class="contenedor-redes">
            💬 ⓕ 𝕏 ♪
        </div>
    </footer>
    <div class="overlay-carrito" aria-hidden="true"></div>
    <aside id="panelCarrito" class="panel-carrito" aria-label="carrito de compras">
        <div class="panel-cabecera">
            <h2>Tu carrito</h2>
            <button class="btn-salir" type="button" aria-label="cerrar carrito">✕</button>
        </div>
        <ul id="listaDeCompras">
        </ul>
        <div class="mensaje-vacio">
            <h3>Tu carrito está vacío</h3>
            <p>¡Vuelve a la tienda para empezar a comprar!</p>
        </div>
        <div class="panel-total">
            Total:<span id="total"></span>
        </div>
    </aside>
    <script type="module" src="js/main.js"></script>
</body>
</html>
